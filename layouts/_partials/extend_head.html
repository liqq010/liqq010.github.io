{{- if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {delimiters: [
    {left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true},
    {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}]});"></script>
{{- end }}
<style>
  /* 文章内的提示框：<div class="callout">...</div> */
  .post-content .callout { border-left: 4px solid #e8590c; background: var(--code-bg); padding: 0.8em 1.1em; margin: 1.5em 0; border-radius: 4px; }
  .post-content .callout > :first-child { margin-top: 0; }
  .post-content .callout > :last-child { margin-bottom: 0; }
  .post-content figure figcaption { text-align: center; font-size: 0.9em; font-weight: normal; color: var(--secondary); }
  .post-content .svg-scroll { overflow-x: auto; margin: 1.5em 0; }
</style>
<style>
  /* x0 × a + eps × b = x_t 这种公式图 */
  .post-content .eq-figure { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .post-content .eq-figure > div:not(.op) { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1 1 0; min-width: 0; max-width: 190px; }
  .post-content .eq-figure img { width: 100%; margin: 0; border-radius: 4px; }
  .post-content .eq-figure .op { font-size: 1.05em; white-space: nowrap; }
</style>
<style>
  /* 宽图：比正文栏宽，居中，最多 1100px，窄屏下贴边留 16px */
  .post-content figure.wide { width: min(1100px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%); }
  .post-content figure.wide img { width: 100%; }
</style>
<style>
  /* 窄屏下长公式和表格在自身内部横向滚动，不撑开页面 */
  .post-content .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .post-content table { display: block; overflow-x: auto; }
  /* KaTeX 根号的 SVG 路径在行尾会多出几个像素，裁掉页面级的横向溢出 */
  body { overflow-x: clip; }
</style>
<style>
  /* 宽表格：和宽图一样突破正文栏，表格本身仍可在窄屏横向滚动 */
  .post-content .wide-table { width: min(1100px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%); }
  .post-content .wide-table table { display: table; width: 100%; }
  @media (max-width: 760px) { .post-content .wide-table table { display: block; } }
</style>
<style>
  /* Part 4 开头的三种方法卡片 */
  .post-content .method-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 1.5em 0; }
  .post-content .method-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--entry); }
  .post-content .method-card .mc-fig svg { width: 100%; height: auto; display: block; }
  .post-content .method-card .mc-name { font-weight: 600; margin: 8px 0 4px; color: var(--primary); }
  .post-content .method-card .mc-name span { font-weight: normal; color: var(--secondary); font-size: 0.9em; }
  .post-content .method-card p { margin: 0; font-size: 0.9em; line-height: 1.5; color: var(--content); }
  @media (max-width: 640px) { .post-content .method-cards { grid-template-columns: 1fr; } }
</style>
<style>
  /* 比正文栏窄的图居中 */
  .post-content figure > img { display: block; margin-left: auto; margin-right: auto; }
</style>
<style>
  /* 文章图片一律直角（覆盖主题 .md-content img 的 8px 圆角） */
  .post-content img { border-radius: 0 !important; }
</style>
