<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gram–Schmidt: from two network outputs a1, a2 to orthonormal b1, b2, and b3 as their cross product" style="width:100%;min-width:600px;height:auto;font-family:inherit"><defs><marker id="gs-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#4c8bf5"/></marker><marker id="gs-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#e8590c"/></marker><marker id="gs-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#c2255c"/></marker><marker id="gs-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--secondary)"/></marker></defs><text x="120.0" y="24.0" text-anchor="middle" style="fill:var(--primary);font-size:14px;">1. network output</text><line x1="40.0" y1="185.0" x2="168.2" y2="185.0" style="stroke:#4c8bf5;stroke-width:2.2" marker-end="url(#gs-b)"/><text x="172.2" y="201.0" text-anchor="start" style="fill:#4c8bf5;font-size:15px;font-style:italic;">a₁</text><line x1="40.0" y1="185.0" x2="92.2" y2="90.0" style="stroke:#e8590c;stroke-width:2.2" marker-end="url(#gs-o)"/><text x="98.2" y="94.0" text-anchor="start" style="fill:#e8590c;font-size:15px;font-style:italic;">a₂</text><text x="120.0" y="225.0" text-anchor="middle" style="fill:var(--secondary);font-size:12px;">not unit length, not perpendicular</text><text x="350.0" y="24.0" text-anchor="middle" style="fill:var(--primary);font-size:14px;">2. remove the part along b₁</text><line x1="270.0" y1="185.0" x2="322.2" y2="90.0" style="stroke:#e8590c;stroke-width:1.6;opacity:.45" marker-end="url(#gs-o)"/><text x="328.2" y="94.0" text-anchor="start" style="fill:#e8590c;font-size:14px;font-style:italic;">a₂</text><line x1="270.0" y1="185.0" x2="322.2" y2="185.0" style="stroke:var(--secondary);stroke-width:5;opacity:.35"/><line x1="322.2" y1="90.0" x2="322.2" y2="185.0" style="stroke:var(--secondary);stroke-width:1.2" stroke-dasharray="3 3"/><text x="314.2" y="205.0" text-anchor="middle" style="fill:var(--secondary);font-size:12px;">(b₁·a₂) b₁</text><line x1="270.0" y1="185.0" x2="365.0" y2="185.0" style="stroke:#4c8bf5;stroke-width:2.4" marker-end="url(#gs-b)"/><text x="369.0" y="179.0" text-anchor="start" style="fill:#4c8bf5;font-size:15px;font-style:italic;">b₁</text><line x1="270.0" y1="185.0" x2="270.0" y2="90.0" style="stroke:#e8590c;stroke-width:2.4" marker-end="url(#gs-o)"/><text x="264.0" y="96.0" text-anchor="end" style="fill:#e8590c;font-size:15px;font-style:italic;">b₂</text><text x="350.0" y="225.0" text-anchor="middle" style="fill:var(--secondary);font-size:12px;">subtract, then normalize</text><text x="590.0" y="24.0" text-anchor="middle" style="fill:var(--primary);font-size:14px;">3. b₃ = b₁ × b₂</text><polygon points="520,175 615,175 670,137 575,137" style="fill:var(--border);opacity:.5;stroke:none"/><line x1="520.0" y1="175.0" x2="615.0" y2="175.0" style="stroke:#4c8bf5;stroke-width:2.4" marker-end="url(#gs-b)"/><text x="619.0" y="189.0" text-anchor="start" style="fill:#4c8bf5;font-size:15px;font-style:italic;">b₁</text><line x1="520.0" y1="175.0" x2="575.0" y2="137.0" style="stroke:#e8590c;stroke-width:2.4" marker-end="url(#gs-o)"/><text x="581.0" y="137.0" text-anchor="start" style="fill:#e8590c;font-size:15px;font-style:italic;">b₂</text><line x1="520.0" y1="175.0" x2="520.0" y2="75.0" style="stroke:#c2255c;stroke-width:2.4" marker-end="url(#gs-r)"/><text x="528.0" y="83.0" text-anchor="start" style="fill:#c2255c;font-size:15px;font-style:italic;">b₃</text><text x="590.0" y="225.0" text-anchor="middle" style="fill:var(--secondary);font-size:12px;">perpendicular to both</text></svg>